spring.application.name=kafka-consumer
spring.main.web-application-type=none
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${SPRING_KAFKA_CONSUMER_GROUP:query-worker-v1}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/sdet_dev?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sdet}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:sdetpass}
app.query-events.topic=${APP_QUERY_EVENTS_TOPIC:query.created.v1}
app.query-processor.delay-ms=${APP_QUERY_PROCESSOR_DELAY_MS:1200}
