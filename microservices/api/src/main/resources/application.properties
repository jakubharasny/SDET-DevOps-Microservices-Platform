spring.application.name=api
server.port=8081
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:meshops_api;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
app.query-events.enabled=${APP_QUERY_EVENTS_ENABLED:false}
app.query-events.topic=${APP_QUERY_EVENTS_TOPIC:query.created.v1}
