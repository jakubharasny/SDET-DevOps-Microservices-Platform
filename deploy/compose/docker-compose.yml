services:
  frontend:
    build:
      context: ../../microservices/frontend
    ports:
      - "8080:8080"
    environment:
      - API_BASE_URL=http://localhost:8081
  api:
    build:
      context: ../../microservices/api
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/sdet_dev?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=sdet
      - SPRING_DATASOURCE_PASSWORD=sdetpass
      - SPRING_SQL_INIT_MODE=always
      - APP_QUERY_EVENTS_ENABLED=true
      - APP_QUERY_EVENTS_TOPIC=query.created.v1
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
  kafka-consumer:
    build:
      context: ../../microservices/kafka-consumer
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/sdet_dev?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=sdet
      - SPRING_DATASOURCE_PASSWORD=sdetpass
      - APP_QUERY_EVENTS_TOPIC=query.created.v1
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - APP_QUERY_PROCESSOR_DELAY_MS=1200
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
      api:
        condition: service_started
  kafka:
    image: apache/kafka:3.7.1
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: sdet_dev
      MYSQL_USER: sdet
      MYSQL_PASSWORD: sdetpass
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mysql_data:
